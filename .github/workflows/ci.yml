name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subastas_vip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subastas_vip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subastas_vip?schema=public
        run: npx prisma migrate deploy

      - name: Migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subastas_vip?schema=public
        run: npx prisma migrate status

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alertas-vip-subastas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
